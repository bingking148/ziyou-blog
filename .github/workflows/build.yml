name: Build site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/action-hugo@v2
        with:
          # 与本地版本保持一致；升级本地 Hugo 后记得同步改这里
          hugo-version: '0.160.1'
          extended: true

      - name: Build
        # 生产构建必须带 --minify --gc：minify 触发主题的 CSS 压缩+指纹分支（hugo.IsProduction），
        # 也保证产物里不会混入 hugo server 的 livereload / localhost 残留
        run: hugo --minify --gc --cleanDestinationDir

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public/
          retention-days: 14

  # 目前部署方式：从 Actions 页面下载 site 产物（zip），解压后上传到自己的服务器。
