name: Build site

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # 与本地版本保持一致；升级本地 Hugo 后记得同步改这里
  HUGO_VERSION: '0.160.1'

jobs:
  # 线上版本：Astro 新站（2026-10-31 起上线），部署上传 site 产物
  build-astro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: astro/dist/
          retention-days: 14

  # Hugo 旧站：已下线，仅保留构建作为回滚产物（新版出问题时重新上传即可整体回滚）
  build-hugo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不再用 peaceiris/action-hugo：该仓库已无法解析（repository not found）。
      # 直接从 gohugoio/hugo 官方 release 下载钉死版本的 extended 二进制。
      - name: Setup Hugo
        run: |
          curl -fsSL -o hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo install -m 755 hugo /usr/local/bin/hugo
          hugo version

      - name: Build
        # 生产构建必须带 --minify --gc：minify 触发主题的 CSS 压缩+指纹分支（hugo.IsProduction），
        # 也保证产物里不会混入 hugo server 的 livereload / localhost 残留
        run: hugo --minify --gc --cleanDestinationDir

      - name: Upload Hugo legacy artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-hugo-legacy
          path: public/
          retention-days: 14

  # 部署方式不变：从 Actions 页面下载产物（zip），解压后上传到自己的服务器。
  # 上线站 = site（Astro）；回滚 = site-hugo-legacy（Hugo）。
  # 如果以后想自动部署到 GitHub Pages：
  #   1. 仓库 Settings -> Pages -> Source 选 GitHub Actions
  #   2. 取消下面整个 job 的注释，并把 path 改为 astro/dist/
  # deploy-pages:
  #   needs: build-astro
  #   permissions:
  #     pages: write
  #     id-token: write
  #   runs-on: ubuntu-latest
