{{- if .Site.Params.share_card.enable -}}
<div class="share-card" id="share-card" data-url="{{ .Permalink }}">
  <span class="share-card-icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"></circle>
      <circle cx="6" cy="12" r="3"></circle>
      <circle cx="18" cy="19" r="3"></circle>
      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
      <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
    </svg>
  </span>
  <span class="share-card-text">{{ i18n "share_card_text" }}</span>
</div>
<script>
(function() {
  var card = document.getElementById('share-card');
  if (!card) return;
  card.addEventListener('click', function() {
    var url = card.getAttribute('data-url');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function() {
        showCopyToast();
      }).catch(function() {
        fallbackCopy(url);
      });
    } else {
      fallbackCopy(url);
    }
  });
  function fallbackCopy(text) {
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand('copy');
    } catch(e) {}
    document.body.removeChild(textarea);
    showCopyToast();
  }
  function showCopyToast() {
    var toast = document.createElement('div');
    toast.textContent = '{{ i18n "share_card_copied" }}';
    toast.setAttribute('style', 
      'position:fixed!important;' +
      'top:100px!important;' +
      'left:50%!important;' +
      'transform:translateX(-50%)!important;' +
      'background:#4285f4!important;' +
      'color:#fff!important;' +
      'border-radius:8px!important;' +
      'padding:14px 28px!important;' +
      'font-size:15px!important;' +
      'font-weight:600!important;' +
      'z-index:2147483647!important;' +
      'box-shadow:0 4px 20px rgba(66,133,244,0.5)!important;' +
      'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif!important;'
    );
    document.body.appendChild(toast);
    setTimeout(function() {
      if (toast && toast.parentNode) {
        toast.parentNode.removeChild(toast);
      }
    }, 2500);
  }
})();
</script>
{{- end -}}
