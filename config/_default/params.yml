injector:
  head_begin:
  head_end: |
    <!-- 字体全部自托管（/resources/），不再依赖 jsdelivr / Google Fonts，国内直连可达 -->
    <!-- 霞鹜文楷 Screen：中文正文衬线（异步加载，不阻塞首屏） -->
    <link rel="stylesheet" href="/resources/lxgw-wenkai-screen-webfont@1.1.0/style.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="/resources/lxgw-wenkai-screen-webfont@1.1.0/style.css" /></noscript>
    <!-- Mulish：拉丁字符正文（异步加载） -->
    <link rel="stylesheet" href="/resources/mulish/mulish.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="/resources/mulish/mulish.css" /></noscript>
    <style>
    #header img {
      top: -10px;
    }
    /* 隐藏 RSS 订阅按钮（不用此功能） */
    #nav-rss-link {
      display: none !important;
    }
    /* 朱砂点睛：选区与悬停反馈 */
    ::selection {
      background: #bf4136;
      color: #fff;
    }
    [data-theme="dark"] ::selection {
      background: #c9553f;
    }
    #main a:hover,
    .article-nav-link:hover,
    .post-link:hover .post-title {
      color: #bf4136;
    }
    [data-theme="dark"] #main a:hover,
    [data-theme="dark"] .article-nav-link:hover {
      color: #d98063;
    }
    </style>
    <style>
    /* ===== yzrt · 导航玻璃 pill：弹簧胶囊跟随悬停/激活项 ===== */
    #main-nav {
      position: relative;
      z-index: 0;
    }
    .reimu-nav-pill {
      position: absolute;
      z-index: -1;
      top: 3px;
      left: 0;
      height: calc(100% - 6px);
      border-radius: 999px;
      background: var(--red-5);
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow:
        inset 2px -2px 1px -1px rgba(255, 255, 255, 0.75),
        inset -2px 2px 1px -1px rgba(255, 255, 255, 0.75),
        0 2px 10px var(--color-red-3-shadow, rgba(44, 83, 130, 0.22));
      transition:
        transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
        width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 0.3s ease;
    }
    .reimu-nav-pill.is-ready {
      opacity: 1;
    }
    [data-theme="dark"] .reimu-nav-pill {
      background: rgba(130, 167, 204, 0.16);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.08),
        0 2px 12px rgba(0, 0, 0, 0.35);
    }
    /* ===== launch · Hero 标题逐字入场 ===== */
    #header.hero-home #header-title .hero-letter {
      display: inline-block;
      animation: hero-letter-in 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      animation-delay: calc(var(--i) * 80ms + 150ms);
      transition: transform 0.3s ease;
    }
    #header.hero-home #header-title .hero-letter:hover {
      transform: translateY(-0.08em);
    }
    @keyframes hero-letter-in {
      0% {
        opacity: 0;
        transform: translateY(0.55em) rotate(6deg) scale(0.92);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: none;
        filter: blur(0);
      }
    }
    /* ===== Go Pro · CTA 液态填充悬停 ===== */
    #hero-cta-read {
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    #hero-cta-read::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: 0;
      top: 50%;
      width: 150%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: #fff;
      mix-blend-mode: difference;
      transform: translate(-104%, -50%);
      transition:
        transform 0.55s cubic-bezier(0.65, 0, 0.35, 1),
        border-radius 0.55s cubic-bezier(0.65, 0, 0.35, 1);
      pointer-events: none;
    }
    #hero-cta-read:hover::before,
    #hero-cta-read:focus-visible::before {
      transform: translate(-2%, -50%);
      border-radius: 0;
    }
    #hero-cta-read:active {
      transform: translateY(2px);
    }
    /* ===== 拟态 · 按压态细节 ===== */
    #nav-circle-half-stroke-btn,
    #main-nav-toggle,
    .hero-cta-about {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    #nav-circle-half-stroke-btn:active,
    #main-nav-toggle:active,
    .hero-cta-about:active {
      transform: scale(0.94);
      box-shadow:
        inset 3px 3px 6px rgba(28, 52, 84, 0.14),
        inset -3px -3px 6px rgba(255, 255, 255, 0.75);
    }
    [data-theme="dark"] #nav-circle-half-stroke-btn:active,
    [data-theme="dark"] #main-nav-toggle:active,
    [data-theme="dark"] .hero-cta-about:active {
      box-shadow:
        inset 3px 3px 6px rgba(0, 0, 0, 0.45),
        inset -3px -3px 6px rgba(255, 255, 255, 0.06);
    }
    /* ===== 编辑排版 · 首字下沉 ===== */
    .article-entry > p:first-of-type::first-letter {
      float: left;
      font-size: 3em;
      line-height: 1;
      padding: 0.04em 0.14em 0.02em 0;
      font-family: "LXGW WenKai Screen", "LXGW WenKai", serif;
      font-weight: 700;
      color: var(--red-1, #2c5382);
    }
    /* 减少动态效果：关闭三大动画 */
    @media (prefers-reduced-motion: reduce) {
      .reimu-nav-pill {
        transition: opacity 0.3s ease;
      }
      #header.hero-home #header-title .hero-letter {
        animation: none;
      }
      #hero-cta-read::before {
        transition: none;
      }
    }
    </style>
