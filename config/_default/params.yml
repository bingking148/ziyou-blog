  body_begin:
  body_end: |
    <script>
    (function () {
      'use strict';
      // 封面主色驱动：文章页从封面提取主色，让链接、按钮、玻璃高光、引用线跟随封面氛围变化
      var cached = null;
      function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        var max = Math.max(r, g, b), min = Math.min(r, g, b);
        var h, s, l = (max + min) / 2;
        if (max === min) { h = s = 0; } else {
          var d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          if (max === r) { h = (g - b) / d + (g < b ? 6 : 0); }
          else if (max === g) { h = (b - r) / d + 2; }
          else { h = (r - g) / d + 4; }
          h /= 6;
        }
        return [h * 360, s, l];
      }
